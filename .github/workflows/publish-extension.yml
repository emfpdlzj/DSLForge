name: Publish Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-extension-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect_release:
    name: detect release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect unpublished package version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_version=$(node -p "require('./package.json').version")
          release_tag="v${package_version}"

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version $package_version is not a supported release version."
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "Version $package_version is already tagged; skipping Marketplace publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          escaped_version=${package_version//./\\.}
          if ! grep -Eq "^## ${escaped_version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a dated $package_version release heading."
            exit 1
          fi

          echo "Version $package_version has not been published yet."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: detect_release
    if: needs.detect_release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      DSLFORGE_TELEMETRY_PROXY_ENDPOINT: ${{ vars.DSLFORGE_TELEMETRY_PROXY_ENDPOINT }}
      RELEASE_TAG: ${{ needs.detect_release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.detect_release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run format:check

      - name: Run typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm run test

      - name: Verify extension package contents
        run: npm exec -- vsce ls

      - name: Package extension
        run: npm exec -- vsce package --out "dslforge-${RELEASE_VERSION}.vsix"

      - name: Upload extension package
        uses: actions/upload-artifact@v7
        with:
          name: dslforge-${{ needs.detect_release.outputs.tag }}
          path: dslforge-*.vsix
          if-no-files-found: error

      - name: Create release tag
        id: release_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish extension
        id: marketplace_publish
        run: npm exec -- vsce publish --oidc --packagePath "dslforge-${RELEASE_VERSION}.vsix"

      - name: Remove release tag after publish failure
        if: always() && steps.release_tag.outcome == 'success' && steps.marketplace_publish.outcome != 'success'
        run: git push origin --delete "$RELEASE_TAG"
